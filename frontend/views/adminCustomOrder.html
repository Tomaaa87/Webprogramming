<div class="admin-container">
	<header class="admin-header">
		<h1>Custom Orders Admin</h1>
		<p>Moderate and manage custom orders</p>
	</header>

	<div class="admin-grid">
		<section class="admin-card">
			<h2>Browse</h2>
			<p>List all or by user, get by ID</p>
			<div class="admin-actions">
				<button class="admin-btn" id="admin-list-custom-orders">List Custom Orders</button>
				<button class="admin-btn" id="admin-custom-orders-by-user">Custom Orders By User</button>
				<button class="admin-btn" id="admin-custom-order-by-id">Get Custom Order By ID</button>
			</div>
		</section>

		<section class="admin-card">
			<h2>Modify</h2>
			<p>Create, update, delete, or update status</p>
			<div class="admin-actions">
				<button class="admin-btn" id="admin-insert-custom-order">Insert Custom Order</button>
				<button class="admin-btn" id="admin-update-custom-order">Update Custom Order</button>
				<button class="admin-btn" id="admin-update-custom-order-status">Update Status</button>
				<button class="admin-btn admin-btn-danger" id="admin-delete-custom-order">Delete Custom Order</button>
			</div>
		</section>
	</div>
	<div id="admin-output" class="admin-output">
		<div id="admin-status" class="admin-status"></div>
		<div id="admin-table" class="admin-table"></div>
	</div>
</div>
