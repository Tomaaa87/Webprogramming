<div class="admin-container">
	<header class="admin-header">
		<h1>Order Items Admin</h1>
		<p>Manage items within orders</p>
	</header>

	<div class="admin-grid">
		<section class="admin-card">
			<h2>Browse</h2>
			<p>List items by order</p>
			<div class="admin-actions">
				<button class="admin-btn" id="admin-list-order-items">List Items by Order</button>
			</div>
		</section>

		<section class="admin-card">
			<h2>Modify</h2>
			<p>Delete items or adjust quantities</p>
			<div class="admin-actions">
				<button class="admin-btn admin-btn-danger" id="admin-delete-order-items">Delete Items by Order</button>
				<button class="admin-btn" id="admin-update-item-quantity">Update Item Quantity</button>
				<button class="admin-btn" id="admin-delete-single-item">Delete Single Item</button>
				<button class="admin-btn" id="admin-calc-order-total">Calculate Order Total</button>
				<button class="admin-btn" id="admin-item-qty-by-product">Product Quantity By Order</button>
			</div>
		</section>
	</div>
	<div id="admin-output" class="admin-output">
		<div id="admin-status" class="admin-status"></div>
		<div id="admin-table" class="admin-table"></div>
	</div>

    <!-- List Items By Order Modal -->
    <div id="modal-list-items-by-order" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-list-items-by-order">&times;</span>
            <h2>List Items By Order</h2>
            <form id="form-list-items-by-order">
                <label>Order ID</label>
                <input type="number" id="input-list-items-order-id" required>
                <br><br>
                <button type="submit" class="admin-btn">List Items</button>
            </form>
        </div>
    </div>

    <!-- Delete Items By Order Modal -->
    <div id="modal-delete-items-by-order" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-delete-items-by-order">&times;</span>
            <h2>Delete All Items In Order</h2>
            <form id="form-delete-items-by-order">
                <label>Order ID</label>
                <input type="number" id="input-delete-items-order-id" required>
                <br><br>
                <button type="submit" class="admin-btn admin-btn-danger">Delete All Items</button>
            </form>
        </div>
    </div>

    <!-- Update Item Quantity Modal -->
    <div id="modal-update-item-quantity" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-update-item-quantity">&times;</span>
            <h2>Update Item Quantity</h2>
            <form id="form-update-item-quantity">
                <label>Order ID</label>
                <input type="number" id="input-update-qty-order-id" required>
                <br><br>
                <label>Product Name (Exact Match)</label>
                <input type="text" id="input-update-qty-product-name" required>
                <br><br>
                <label>New Quantity</label>
                <input type="number" id="input-update-qty-val" required>
                <br><br>
                <button type="submit" class="admin-btn">Update Quantity</button>
            </form>
        </div>
    </div>

    <!-- Delete Single Item Modal -->
    <div id="modal-delete-single-item" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-delete-single-item">&times;</span>
            <h2>Delete Single Item</h2>
            <form id="form-delete-single-item">
                <label>Order Item ID</label>
                <input type="number" id="input-delete-single-item-id" required>
                <br><br>
                <button type="submit" class="admin-btn admin-btn-danger">Delete Item</button>
            </form>
        </div>
    </div>

    <!-- Calculate Order Total Modal -->
    <div id="modal-calc-order-total" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-calc-order-total">&times;</span>
            <h2>Calculate Order Total</h2>
            <form id="form-calc-order-total">
                <label>Order ID</label>
                <input type="number" id="input-calc-total-order-id" required>
                <br><br>
                <button type="submit" class="admin-btn">Calculate</button>
            </form>
        </div>
    </div>

    <!-- Item Quantity By Product Modal -->
    <div id="modal-item-qty-by-product" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-item-qty-by-product">&times;</span>
            <h2>Product Quantity Total</h2>
            <form id="form-item-qty-by-product">
                <label>Product ID</label>
                <input type="number" id="input-qty-by-product-id" required>
                <br><br>
                <button type="submit" class="admin-btn">Get Quantity</button>
            </form>
        </div>
    </div>
</div>
