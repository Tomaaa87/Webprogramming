<div class="admin-container">
	<header class="admin-header">
		<h1>Product Admin</h1>
		<p>Manage products and stock</p>
	</header>

	<div class="admin-grid">
		<section class="admin-card">
			<h2>Browse</h2>
			<p>View products by category or in stock</p>
			<div class="admin-actions">
				<button class="admin-btn" id="admin-products-by-category">Products By Category</button>
				<button class="admin-btn" id="admin-products-in-stock">Products In Stock</button>
				<button class="admin-btn" id="admin-product-by-id">Get Product By ID</button>
				<button class="admin-btn" id="admin-products-all">All Products</button>
			</div>
		</section>

		<section class="admin-card">
			<h2>Modify</h2>
			<p>Add, update, delete, or update stock</p>
			<div class="admin-actions">
				<button class="admin-btn" id="admin-add-product">Add Product</button>
				<button class="admin-btn" id="admin-update-product">Update Product</button>
				<button class="admin-btn" id="admin-update-stock">Update Stock</button>
				<button class="admin-btn admin-btn-danger" id="admin-delete-product">Delete Product</button>
			</div>
		</section>
	</div>
	<div id="admin-output" class="admin-output">
		<div id="admin-status" class="admin-status"></div>
		<div id="admin-table" class="admin-table"></div>
	</div>

    <!-- Products By Category Modal -->
    <div id="modal-products-by-category" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-products-by-category">&times;</span>
            <h2>Products By Category</h2>
            <form id="form-products-by-category">
                <label>Category ID</label>
                <input type="number" id="input-products-by-category-id" required>
                <br><br>
                <button type="submit" class="admin-btn">Search</button>
            </form>
        </div>
    </div>

    <!-- Get Product By ID Modal -->
    <div id="modal-product-by-id" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-product-by-id">&times;</span>
            <h2>Get Product By ID</h2>
            <form id="form-product-by-id">
                <label>Product ID</label>
                <input type="number" id="input-product-by-id-val" required>
                <br><br>
                <button type="submit" class="admin-btn">Search</button>
            </form>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div id="modal-add-product" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-add-product">&times;</span>
            <h2>Add Product</h2>
            <form id="form-add-product">
                <label>Name</label>
                <input type="text" id="input-add-product-name" required>
                <br><br>
                <label>Price</label>
                <input type="number" step="0.01" id="input-add-product-price" required>
                <br><br>
                <label>Description</label>
                <input type="text" id="input-add-product-description" required>
                <br><br>
                <label>Category ID</label>
                <input type="number" id="input-add-product-category-id" required>
                <br><br>
                <label>Image URL (Optional)</label>
                <input type="text" id="input-add-product-image-url">
                <br><br>
                <button type="submit" class="admin-btn">Add Product</button>
            </form>
        </div>
    </div>

    <!-- Update Product Modal -->
    <div id="modal-update-product" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-update-product">&times;</span>
            <h2>Update Product</h2>
            <form id="form-update-product">
                <label>Product ID</label>
                <input type="number" id="input-update-product-id" required>
                <br><br>
                <label>New Name (Optional)</label>
                <input type="text" id="input-update-product-name">
                <br><br>
                <label>New Price (Optional)</label>
                <input type="number" step="0.01" id="input-update-product-price">
                <br><br>
                <label>New Description (Optional)</label>
                <input type="text" id="input-update-product-description">
                <br><br>
                <label>New Category ID (Optional)</label>
                <input type="number" id="input-update-product-category-id">
                <br><br>
                <label>New Image URL (Optional)</label>
                <input type="text" id="input-update-product-image-url">
                <br><br>
                <button type="submit" class="admin-btn">Update Product</button>
            </form>
        </div>
    </div>

    <!-- Update Stock Modal -->
    <div id="modal-update-stock" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-update-stock">&times;</span>
            <h2>Update Stock</h2>
            <form id="form-update-stock">
                <label>Product ID</label>
                <input type="number" id="input-update-stock-id" required>
                <br><br>
                <label>New Stock Quantity</label>
                <input type="number" id="input-update-stock-val" required>
                <br><br>
                <button type="submit" class="admin-btn">Update Stock</button>
            </form>
        </div>
    </div>

    <!-- Delete Product Modal -->
    <div id="modal-delete-product" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" data-modal="modal-delete-product">&times;</span>
            <h2>Delete Product</h2>
            <form id="form-delete-product">
                <label>Product ID</label>
                <input type="number" id="input-delete-product-id" required>
                <br><br>
                <button type="submit" class="admin-btn admin-btn-danger">Delete</button>
            </form>
        </div>
    </div>
</div>
