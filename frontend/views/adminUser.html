<div class="admin-container">
	<header class="admin-header">
		<h1>User Admin</h1>
		<p>Manage users, roles, and accounts</p>
	</header>

	<div class="admin-grid">
		<section class="admin-card">
			<h2>Browse & Search</h2>
			<p>List, filter by role, or search users</p>
			<div class="admin-actions">
				<button class="admin-btn" id="admin-list-users">List Users</button>
				<button class="admin-btn" id="admin-search-users">Search Users</button>
				<button class="admin-btn" id="admin-users-by-role">Users By Role</button>
				<button class="admin-btn" id="admin-user-by-id">Get User By ID</button>
				<button class="admin-btn" id="admin-user-by-email">Get User By Email</button>
			</div>
		</section>

		<section class="admin-card">
			<h2>Modify</h2>
			<p>Create, update, or delete users</p>
			<div class="admin-actions">
				<button class="admin-btn" id="admin-add-user">Add User</button>
				<button class="admin-btn" id="admin-update-user">Update User</button>
				<button class="admin-btn admin-btn-danger" id="admin-delete-user">Delete User</button>
			</div>
		</section>
	</div>
</div>
