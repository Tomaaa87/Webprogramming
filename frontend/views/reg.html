
<div class="container">
<body>
    <h2>Create an Account</h2>
    <form id="register-form">
        <label for="name">name</label>
        <input type="text" id="name" name="name" required placeholder="NAME LASTNAME">
        <br><br>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="example@example.com">
        <small id="emailError" class="error-message">Please enter a valid email address.</small>
        <br><br>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="+1234567890" pattern="^\+?\d{10,15}$">
        <small>Include country code, e.g., +387 for BIH</small>
        <br><br>

        <label for="password">Password</label>
        <input type="text" id="password" name="password" required minlength="8" placeholder="Enter a secure password">
        <small>Minimum 8 characters, including uppercase, lowercase, number, and special character.</small>
        <div class="strength-meter">
            <div id="strengthBar" class="strength-bar"></div>
        </div>
        <br><br>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" required placeholder="123 Sarajevo,">
        <br><br>

        <button type="button" class="btn" onclick="UserService.handleRegister()">Register</button>
    </form>
        <button class="btn-secondary" onclick="window.location.hash='login'">
      Back to Login
    </button>
    <div id="successMessage" style="display: none;">Your data has been saved successfully!</div>
    
    
   
    
</body>

</div>
